name: Deploy CareerPilot staging (manual)

# GitHub must register this file on the default branch before manual dispatch is available.
# Do not add push, pull_request, workflow_run, or production deployment triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerpilot-staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  staging:
    name: Validate and deploy careerpilot-staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'sudhiriips-alt/careerpilot' &&
      github.ref == 'refs/heads/feat/resume-document-import'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Enforce repository, event and branch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'sudhiriips-alt/careerpilot'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/feat/resume-document-import'

      - name: Check out the selected immutable commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Build and validate staging assets
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/build-staging.mjs
          node --test tests/auth_race_test.cjs tests/cloud_import_test.cjs tests/staging_assets_test.cjs
          node --check scripts/build-staging.mjs
          git diff --exit-code

      # Install tooling before Cloudflare secrets are placed in any process environment.
      - name: Install exact Wrangler version
        run: npm install --prefix "$RUNNER_TEMP/careerpilot-wrangler" --no-audit --no-fund --save-exact wrangler@4.156.0

      - name: Check staging deployment without uploading
        run: >-
          node "$RUNNER_TEMP/careerpilot-wrangler/node_modules/wrangler/bin/wrangler.js"
          deploy --dry-run --config wrangler.staging.json
          --name careerpilot-staging --outdir "$RUNNER_TEMP/careerpilot-staging-dryrun"

      - name: Check local Cloudflare asset serving
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/careerpilot-wrangler/node_modules/wrangler/bin/wrangler.js" dev \
            --local --config wrangler.staging.json --port 8787 --inspector-port 9230 \
            > "$RUNNER_TEMP/careerpilot-staging-runtime.log" 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/careerpilot-staging-runtime.log"
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:8787/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/careerpilot-staging-runtime.log"
            exit 1
          fi
          STAGING_TEST_URL=http://127.0.0.1:8787/ node --test tests/staging_http_test.cjs

      # Secrets are confined to this final step, after all validation has succeeded.
      - name: Deploy only careerpilot-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'sudhiriips-alt/careerpilot'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/feat/resume-document-import'
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repository Actions secrets. No deployment was attempted.'
            exit 1
          fi
          node "$RUNNER_TEMP/careerpilot-wrangler/node_modules/wrangler/bin/wrangler.js" deploy \
            --config wrangler.staging.json --name careerpilot-staging
