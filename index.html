<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172b50"><meta name="description" content="CareerPilot — organize your job search and applications"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>CareerPilot — Job Search Workspace</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="shell"><aside class="sidebar"><div class="brand"><div class="mark">✦</div><div><strong>CareerPilot</strong><span>Job search workspace</span></div></div><div class="sidelabel">WORKSPACE</div><nav id="nav"><button class="active" data-view="overview">◫ <span>Overview</span></button><button data-view="tracker">▤ <span>Job tracker</span></button><button data-view="discover">⌕ <span>Discover jobs</span></button><button data-view="assistant">✧ <span>Career assistant</span></button><button data-view="activity">◷ <span>Follow-ups</span></button></nav><div class="sidefoot"><div class="sidecard"><div>✦ Your next move</div><p>Build a consistent application routine and never lose track of an opportunity.</p></div><small>Private, local-first MVP · v1.0</small></div></aside>
<main class="main"><header class="topbar"><button class="menu" id="menuBtn" aria-label="Toggle menu">☰</button><div class="breadcrumbs">Workspace <span>/</span> <b id="pageCrumb">Overview</b></div><div class="topactions"><span id="todayLabel"></span><button id="exportBtn" class="button ghost">⇩ Export</button><button id="addTop" class="button primary">＋ Add job</button></div></header><div class="content"><div id="view"></div></div></main></div>
<dialog id="jobDialog"><form id="jobForm"><div class="modalHead"><div><h2 id="dialogTitle">Add opportunity</h2><p>Track the details that matter for your next step.</p></div><button type="button" class="close" id="closeModal" aria-label="Close">×</button></div><input name="id" type="hidden"><div class="formGrid"><label>Job title <input name="title" placeholder="Monitoring & Evaluation Consultant" required maxlength="160"></label><label>Organisation <input name="company" placeholder="Organisation name" required maxlength="160"></label><label>Location <input name="location" placeholder="Remote · India" maxlength="160"></label><label>Work type <select name="type"><option>Full-time</option><option>Consulting</option><option>Freelance</option><option>Contract</option><option>Part-time</option><option>Internship</option></select></label><label>Current stage <select name="status"><option>Saved</option><option>Applying</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Closed</option></select></label><label>Priority <select name="priority"><option>High</option><option>Medium</option><option>Low</option></select></label><label>Application deadline <input name="deadline" type="date"></label><label>Follow-up date <input name="followup" type="date"></label><label class="full">Job posting URL <input name="url" type="url" placeholder="https://company.com/careers/role"></label><label class="full">Notes / requirements <textarea name="notes" rows="3" placeholder="Skills, responsibilities, contact, next action..."></textarea></label></div><div class="modalActions"><button type="button" class="button ghost" id="cancelModal">Cancel</button><button class="button primary" type="submit">Save opportunity</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="app.js" defer></script></body></html>
